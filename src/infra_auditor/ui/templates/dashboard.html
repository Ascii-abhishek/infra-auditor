<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Infra Auditor v{{ project_version }}</title>
  <script>
    try {
      const theme = localStorage.getItem("infra-auditor-theme") || "light";
      const sidebar = localStorage.getItem("infra-auditor-sidebar");
      document.documentElement.dataset.bsTheme = theme;
      if (sidebar === "collapsed") {
        document.documentElement.classList.add("sidebar-collapsed");
      }
    } catch {
      document.documentElement.dataset.bsTheme = "light";
    }
  </script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/static/app.css?v={{ static_asset_version }}" rel="stylesheet">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand-block">
        <div class="brand-mark">IA</div>
        <div class="brand-copy">
          <div class="brand-heading">
            <div class="brand-title">Infra Auditor</div>
            <span class="brand-version">v{{ project_version }}</span>
          </div>
          <div class="brand-metadata" aria-label="Project environment and snapshot bucket">
            <span class="brand-environment">{{ settings.environment }}</span>
            <span class="brand-separator" aria-hidden="true">·</span>
            <span class="brand-bucket" title="Snapshot bucket: {{ settings.snapshot_bucket }}">
              <i aria-hidden="true" class="bi bi-bucket"></i>
              <span>{{ settings.snapshot_bucket }}</span>
            </span>
          </div>
        </div>
        <button class="icon-button theme-toggle" type="button" data-theme-toggle aria-label="Toggle theme">
          <i aria-hidden="true" class="bi bi-moon-stars"></i>
        </button>
      </div>

      <button class="sidebar-toggle" type="button" data-sidebar-toggle aria-label="Collapse sidebar">
        <i aria-hidden="true" class="bi bi-chevron-left"></i>
      </button>

      <div class="sidebar-actions">
        <form method="post" action="/sync-jobs?mode=latest&target=all&section={{ section }}&instance={{ selected_instance }}" data-sync-form>
          <button class="nav-item sidebar-action" type="submit" title="Sync all" aria-label="Sync all">
            <i aria-hidden="true" class="bi bi-arrow-repeat"></i><span>Sync all</span>
          </button>
        </form>
      </div>

      <nav class="nav-list" aria-label="Audit sections">
        {% for item in nav_items %}
          <a class="nav-item {% if section == item.id %}active{% endif %}" href="/?section={{ item.id }}{% if item.href_extra == 'instance' %}&instance={{ selected_instance }}{% endif %}" title="{{ item.label }}">
            <i aria-hidden="true" class="bi {{ item.icon }}"></i>
            <span>{{ item.label }}</span>
            <small>{{ item.state }}</small>
          </a>
        {% endfor %}
      </nav>

      <div class="chat-dock">
        <a class="nav-item {% if section == 'chat' %}active{% endif %}" href="/?section=chat" title="Chat">
          <i aria-hidden="true" class="bi bi-chat-square-text"></i>
          <span>Chat</span>
          <small>Queued</small>
        </a>
      </div>
    </aside>

    <main class="content" id="content-root" data-content-url="{{ content_url }}">
      <div class="loader-panel" role="status" aria-live="polite">
        <div class="spinner-border text-primary" aria-hidden="true"></div>
        <div class="loader-title">Loading audit data</div>
        <div class="loader-copy">Preparing {{ section_label }} from the latest snapshot context.</div>
      </div>
    </main>
  </div>
  <script src="/static/app.js?v={{ static_asset_version }}"></script>
</body>
</html>
