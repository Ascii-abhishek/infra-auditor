<form method="post" action="/sync-jobs?mode=latest&target=instance&section={{ section }}&instance={{ selected_instance }}&database={{ selected_database | urlencode }}&subservice={{ selected_subservice | urlencode }}" data-sync-form data-instance-sync-form>
  <button class="btn btn-sm btn-primary" type="submit">
    <i aria-hidden="true" class="bi bi-arrow-clockwise"></i>
    <span>Sync now</span>
  </button>
</form>
