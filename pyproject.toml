[project]
name = "infra-auditor"
version = "0.1.0"
description = "Deterministic infrastructure and database auditor for AWS RDS PostgreSQL."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.80",
    "jinja2>=3.1.6",
    "psycopg[binary]>=3.3.4",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "structlog>=26.1.0",
    "tenacity>=9.1.4",
    "typer>=0.27.1",
]

[project.scripts]
infra-auditor = "infra_auditor.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: opt-in tests that may require live AWS or PostgreSQL resources",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["boto3", "botocore.*", "psycopg", "psycopg.*", "yaml"]
ignore_missing_imports = true
